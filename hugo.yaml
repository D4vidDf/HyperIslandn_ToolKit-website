# Hugo configuration file
title: Hyper Island ToolKit

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Contact ↗
      url: "https://d4viddf.com"
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/D4vidDf/HyperIsland-ToolKit"
      params:
        icon: github
    - name: Bluesky
      weight: 6
      url: "https://bsky.app/profile/d4viddf.com"
      params:
        icon: bluesky

params:
  description: "A powerful Kotlin library to easily implement Xiaomi HyperOS Dynamic Island notifications."
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false
