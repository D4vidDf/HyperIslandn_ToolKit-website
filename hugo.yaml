title: "HyperIsland ToolKit"
baseURL: "https://hyperisland.d4viddf.com"
languageCode: "en-us"

# Import Hextra
module:
  imports:
    - path: github.com/imfing/hextra

# Required for Search to work
outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: "tango"
    lineNos: true

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1

    # --- Version Selector ---
    - name: Latest Version
      identifier: version
      weight: 2
      params:
        icon: chevron-down
    - name: "v0.4.3 (Latest)"
      url: "/docs"
      parent: version
    - name: "v0.4.1"
      url: "https://github.com/D4vidDf/HyperIsland-ToolKit/releases/tag/0.4.1"
      parent: version
      
    - name: About
      pageRef: /about
      weight: 3

    - name: Contact
      url: "https://d4viddf.com"
      weight: 3

    # --- Support / Sponsor Button ---
    - name: Support
      weight: 4
      url: "https://github.com/sponsors/D4vidDf"
      params:
        icon: heart
        type: link

    # The Search Widget
    - name: Search
      weight: 5
      params:
        type: search

    # Social Icons
    - name: GitHub
      weight: 6
      url: "https://github.com/D4vidDf/HyperIsland-ToolKit"
      params:
        icon: github
    - name: Bluesky
      weight: 7
      url: "https://bsky.app/profile/d4viddf.com"
      params:
        icon: bluesky

params:
  description: "A powerful Kotlin library to easily implement Xiaomi HyperOS Dynamic Island notifications."

  # Main Navbar Settings
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      dark: favicon.svg
    width: wide

  # Left Sidebar Settings

  sidebar:
    enable: true
    collapsible: true
    open: true
    filter: true

  # Right Table of Contents (TOC)
  toc:
    enable: true
    heading: "On this page"

  # "Edit this page" link
  editURL:
    enable: true
    base: "https://github.com/D4vidDf/HyperIsland-ToolKit/edit/main/website/content"

  # Footer Settings
  footer:
    displayCopyright: false
    copyright: "© 2025 D4vidDf"
    displayPoweredBy: false
    width: small

  # Theme Toggle
  theme:
    default: system
    displayToggle: true