# Hugo configuration file
title: Hyper Island ToolKit
baseURL: "https://hyperisland.d4viddf.com" # CHANGE THIS to your actual URL
languageCode: "en-us"

# Import Hextra
module:
  imports:
    - path: github.com/imfing/hextra

# Required for Search to work
outputs:
  home: [HTML, RSS, JSON]

markup:
  goldmark:
    renderer:
      unsafe: true # Allows raw HTML (needed for some shortcodes)
  highlight:
    noClasses: false
    style: "tango" # Optional: Choose a color scheme for code blocks
    lineNos: true  # Optional: Adds line numbers to code blocks

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Contact ↗
      url: "https://d4viddf.com"
      weight: 3
    # The Search Widget
    - name: Search
      weight: 4
      params:
        type: search
    # Social Icons
    - name: GitHub
      weight: 5
      url: "https://github.com/D4vidDf/HyperIsland-ToolKit"
      params:
        icon: github
    - name: Bluesky
      weight: 6
      url: "https://bsky.app/profile/d4viddf.com"
      params:
        icon: bluesky

params:
  description: "A powerful Kotlin library to easily implement Xiaomi HyperOS Dynamic Island notifications."
  
  # Main Navbar Settings
  navbar:
    displayTitle: true
    displayLogo: false
    width: wide # Options: normal, wide, full

  # Left Sidebar Settings
  sidebar:
    enable: true
    collapsible: true # Allows folders to be opened/closed
    open: true        # Keeps the current section open
    filter: true      # Adds a search bar specifically for the sidebar menu

  # Right Table of Contents (TOC)
  toc:
    enable: true
    heading: "On this page"

  # "Edit this page" link - Great for open source libraries!
  editURL:
    enable: false
    base: "https://github.com/D4vidDf/HyperIsland-ToolKit/edit/main/content" # Adjust 'main' branch if needed

  # Footer Settings
  footer:
    displayCopyright: true
    copyright: "© 2025 D4vidDf" 
    displayPoweredBy: true # It's nice to give Hextra credit, but optional
    width: wide

  # Blog/Article Dates
  date:
    format: "January 2, 2006"

  # Theme Toggle (Sun/Moon icon)
  theme:
    default: system # system, dark, or light
    displayToggle: true